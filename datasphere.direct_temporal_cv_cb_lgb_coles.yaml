name: ozon-direct-cv-cb-lgb-coles
desc: Four-fold 250k CV for CatBoost + LightGBM on 209 features (177 Funnel + 32 CoLES SSL User Embeddings) on GPU.
cmd: >
  export PYTHONPATH=. ;
  python3 -u scripts/run_direct_temporal_cv.py
  --experiment-config configs/direct_temporal_cv_v1/cb_lgb_coles_209f.yaml
  --pre-run-sha __PRE_RUN_SHA__
  --job-id __JOB_ID__
env:
  python:
    type: manual
    version: 3.10.13
    requirements-file: requirements-datasphere.txt
    local-paths:
      - src/
      - scripts/
      - configs/
      - requirements-datasphere.txt
inputs:
  - data/train.parquet
  - sample_submit.csv
outputs:
  - artifacts/direct_temporal_cv_v1/experiments/direct_cv_cb_lgb_coles_209f_v1/cv_summary.json
  - artifacts/direct_temporal_cv_v1/experiments/direct_cv_cb_lgb_coles_209f_v1/protocol_manifest.json
  - artifacts/direct_temporal_cv_v1/experiments/direct_cv_cb_lgb_coles_209f_v1/resolved_config.yaml
  - artifacts/direct_temporal_cv_v1/experiments/direct_cv_cb_lgb_coles_209f_v1/sha256sums.json
  - artifacts/direct_temporal_cv_v1/experiments/direct_cv_cb_lgb_coles_209f_v1/fold_F1/catboost_direct_predictions.parquet
  - artifacts/direct_temporal_cv_v1/experiments/direct_cv_cb_lgb_coles_209f_v1/fold_F1/lightgbm_direct_predictions.parquet
  - artifacts/direct_temporal_cv_v1/experiments/direct_cv_cb_lgb_coles_209f_v1/fold_F2/catboost_direct_predictions.parquet
  - artifacts/direct_temporal_cv_v1/experiments/direct_cv_cb_lgb_coles_209f_v1/fold_F2/lightgbm_direct_predictions.parquet
  - artifacts/direct_temporal_cv_v1/experiments/direct_cv_cb_lgb_coles_209f_v1/fold_F3/catboost_direct_predictions.parquet
  - artifacts/direct_temporal_cv_v1/experiments/direct_cv_cb_lgb_coles_209f_v1/fold_F3/lightgbm_direct_predictions.parquet
  - artifacts/direct_temporal_cv_v1/experiments/direct_cv_cb_lgb_coles_209f_v1/fold_F4/catboost_direct_predictions.parquet
  - artifacts/direct_temporal_cv_v1/experiments/direct_cv_cb_lgb_coles_209f_v1/fold_F4/lightgbm_direct_predictions.parquet
cloud-instance-types:
  - g1.1
working-storage:
  type: SSD
  size: 100Gb
