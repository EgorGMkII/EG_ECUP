name: ozon-ett-all250k
desc: Full Scale-Up Event-Time Transformer on ALL 250k users (2.75M pairs)

cmd: >
  export PYTHONPATH=. ; python3 scripts/run_ett_all250k_experiment.py

env:
  python:
    type: manual
    version: 3.10.13
    requirements-file: requirements-datasphere.txt
    local-paths:
      - src/
      - scripts/
      - configs/
      - requirements-datasphere.txt
      - data/train.parquet
      - data/snapshots/
      - artifacts/selected_users_100k.parquet
      - selected_users_100k.parquet
      - artifacts/ett_optimization/

outputs:
  - artifacts/ett_optimization/

cloud-instance-types:
  - g1.1
