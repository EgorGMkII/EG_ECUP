name: ozon-direct-cv-penta-stack
desc: Four-fold 250k CV for CatBoost + LightGBM (RMSE + Tweedie) on 226 features with CoLES embeddings on GPU.
cmd: >
  export PYTHONPATH=. ;
  python3 -u scripts/run_direct_temporal_cv.py
  --experiment-config configs/direct_temporal_cv_v1/penta_stack_coles_226f.yaml
  --pre-run-sha __PRE_RUN_SHA__
  --job-id __JOB_ID__
env:
  python:
    type: manual
    version: 3.10.13
    requirements-file: requirements-datasphere.txt
    local-paths:
      - src/
      - scripts/
      - configs/
      - requirements-datasphere.txt
inputs:
  - data/train.parquet
  - sample_submit.csv
outputs:
  - artifacts/direct_temporal_cv_v1/experiments/direct_cv_penta_stack_coles_226f_v1/
cloud-instance-types:
  - g1.1
working-storage:
  type: SSD
  size: 100Gb
