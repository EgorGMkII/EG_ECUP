name: ozon-ssl-pretraining
desc: Controlled Self-Supervised and Dense Sequence Pretraining for GRU-180 (S0, S1, S2)

cmd: >
  export PYTHONPATH=. ; python3 scripts/run_ssl_pretraining_experiments.py

env:
  python:
    type: manual
    version: 3.10.13
    requirements-file: requirements-datasphere.txt
    local-paths:
      - src/
      - scripts/
      - configs/
      - requirements-datasphere.txt
      - data/train.parquet
      - data/snapshots/
      - artifacts/selected_users_100k.parquet
      - artifacts/tweedie_catboost/
      - artifacts/ssl_pretraining/

outputs:
  - artifacts/ssl_pretraining/

cloud-instance-types:
  - g1.1

working-storage:
  type: SSD
  size: 100Gb

graceful-shutdown:
  signal: SIGTERM
  timeout: 30s
