name: ozon-run-b-final-250k
desc: RUN B — Final Retraining on ALL 23 Anchors and Submission Inference (ALL 250k Users)

cmd: >
  export PYTHONPATH=. ; python3 scripts/specialized_hurdle_250k/run_b_final_250k.py

env:
  python:
    type: manual
    version: 3.10.13
    requirements-file: requirements-datasphere.txt
    local-paths:
      - src/
      - scripts/
      - configs/
      - requirements-datasphere.txt
      - data/train.parquet
      - data/snapshots/
      - sample_submit.csv
      - joint_meta_weights_250k.json
      - amount_scaler_250k.json

outputs:
  - submission_specialized_hurdle_joint_250k_v2.csv
  - test_specialists_raw_predictions_250k_v2.parquet
  - run_status.json

cloud-instance-types:
  - g1.1
