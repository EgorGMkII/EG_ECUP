name: ozon-direct-next-gen-pack
desc: Four-fold 250k CV for Next-Gen Pack (Frequency Specialists + Delta Regressor + Two-Tower Network + CatBoost) on GPU.
cmd: >
  export PYTHONPATH=. ;
  python3 -u scripts/run_direct_temporal_cv.py
  --experiment-config configs/direct_temporal_cv_v1/next_generation_pack_v1.yaml
  --pre-run-sha __PRE_RUN_SHA__
  --job-id __JOB_ID__
env:
  python:
    type: manual
    version: 3.10.13
    requirements-file: requirements-datasphere.txt
    local-paths:
      - src/
      - scripts/
      - configs/
      - requirements-datasphere.txt
inputs:
  - data/train.parquet
  - sample_submit.csv
outputs:
  - artifacts/direct_temporal_cv_v1/experiments/direct_cv_next_generation_pack_v1/
cloud-instance-types:
  - g1.1
working-storage:
  type: SSD
  size: 100Gb
