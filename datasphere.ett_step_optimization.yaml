name: ozon-ett-step-optimization
desc: Step-level controlled learning rate experiments (OPT_LR0, OPT_LR1, OPT_LR2) for canonical ETT1

cmd: >
  export PYTHONPATH=. ; python3 scripts/run_ett_step_level_optimization.py

env:
  python:
    type: manual
    version: 3.10.13
    requirements-file: requirements-datasphere.txt
    local-paths:
      - src/
      - scripts/
      - configs/
      - requirements-datasphere.txt
      - data/train.parquet
      - data/snapshots/
      - artifacts/selected_users_100k.parquet
      - selected_users_100k.parquet
      - artifacts/ett_optimization/

outputs:
  - artifacts/ett_optimization/

cloud-instance-types:
  - g1.1
