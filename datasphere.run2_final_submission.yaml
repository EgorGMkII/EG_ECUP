name: ozon-run2-final-submission
desc: RUN 2 - Final Training on ALL 250k users and Submission Inference (Tesla V100 GPU)

cmd: >
  export PYTHONPATH=. ; python3 scripts/run2_train_and_submit.py

env:
  python:
    type: manual
    version: 3.10.13
    requirements-file: requirements-datasphere.txt
    local-paths:
      - src/
      - scripts/
      - configs/
      - requirements-datasphere.txt
      - data/train.parquet
      - data/snapshots/
      - sample_submit.csv
      - canonical_250k_meta_weights.json
      - artifacts/specialized_hurdle/run1_meta_weights.json

outputs:
  - submission_specialized_hurdle_canonical_250k.csv
  - submission_specialized_hurdle_stack.csv

cloud-instance-types:
  - g1.1
