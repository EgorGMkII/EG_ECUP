name: ozon-direct-226f-triple-stack-sub
desc: Full 250k training and inference for 226-Feature Triple Diversity Stack (CatBoost 226f + LightGBM 226f + Multi-Task Direct ETT) on GPU.
cmd: >
  export PYTHONPATH=. ;
  python3 -u scripts/build_direct_226f_triple_stack_submission.py
  --train data/train.parquet
  --sample-submit sample_submit.csv
  --output-root artifacts/direct_226f_triple_stack_submission_v1
  --pre-run-sha __PRE_RUN_SHA__
  --job-id __JOB_ID__
env:
  python:
    type: manual
    version: 3.10.13
    requirements-file: requirements-datasphere.txt
    local-paths:
      - src/
      - scripts/
      - configs/
      - requirements-datasphere.txt
inputs:
  - data/train.parquet
  - sample_submit.csv
outputs:
  - artifacts/direct_226f_triple_stack_submission_v1/
cloud-instance-types:
  - g1.1
working-storage:
  type: SSD
  size: 100Gb
