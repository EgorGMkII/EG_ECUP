name: ozon-reference-framework-v1-screen-full-stack-reference
desc: 25k screen control for the complete CatBoost S1 S2 ETT TCN MLP BTYD stack.
cmd: >
  export PYTHONPATH=. ; export CUDA_VISIBLE_DEVICES=0 ; python3 -u scripts/run_reference_experiment.py --experiment-config configs/reference_framework_v1/experiments/screen_full_stack_v1/post_ny_screen_full_stack_reference_v1.yaml --pre-run-sha __PRE_RUN_SHA__
env:
  python:
    type: manual
    version: 3.10.13
    requirements-file: requirements-datasphere.txt
    local-paths:
      - src/
      - scripts/
      - configs/
      - requirements-datasphere.txt
inputs:
  - data/train.parquet
  - sample_submit.csv
  - artifacts/reference_v1/cohorts/POST_NY_PUBLIC_PROXY/screen_cohort_25k.parquet
outputs:
  - artifacts/reference_v1/experiments/post_ny_screen_full_stack_reference_v1/run_manifest.json
  - artifacts/reference_v1/experiments/post_ny_screen_full_stack_reference_v1/resolved_config.yaml
  - artifacts/reference_v1/experiments/post_ny_screen_full_stack_reference_v1/model_training_report.json
  - artifacts/reference_v1/experiments/post_ny_screen_full_stack_reference_v1/run_a_meta_prediction_bank.parquet
  - artifacts/reference_v1/experiments/post_ny_screen_full_stack_reference_v1/frozen_meta_package.json
  - artifacts/reference_v1/experiments/post_ny_screen_full_stack_reference_v1/run_b_validation_prediction_bank.parquet
  - artifacts/reference_v1/experiments/post_ny_screen_full_stack_reference_v1/validation_report.json
  - artifacts/reference_v1/experiments/post_ny_screen_full_stack_reference_v1/artifact_sha256.json
cloud-instance-types:
  - g1.1
working-storage:
  type: SSD
  size: 100Gb
graceful-shutdown:
  signal: SIGTERM
  timeout: 30s
