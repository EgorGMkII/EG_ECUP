name: ozon-direct-temporal-cv-catboost-btyd
desc: Four-fold 250k direct CatBoost validation with audited causal BTYD classifier features.
cmd: >
  export PYTHONPATH=. ; python3 -u scripts/run_direct_temporal_cv.py
  --experiment-config configs/direct_temporal_cv_v1/catboost_btyd_pending.yaml
  --pre-run-sha __PRE_RUN_SHA__
env:
  python:
    type: manual
    version: 3.10.13
    requirements-file: requirements-datasphere.txt
    local-paths:
      - src/
      - scripts/
      - configs/
      - requirements-datasphere.txt
      - data/train.parquet
      - sample_submit.csv
inputs:
  - data/train.parquet
  - sample_submit.csv
outputs:
  - artifacts/direct_temporal_cv_v1/experiments/direct_cv_catboost_btyd_pending_v1/
cloud-instance-types:
  - g1.1
working-storage:
  type: SSD
  size: 100Gb
graceful-shutdown:
  signal: SIGTERM
  timeout: 30s
