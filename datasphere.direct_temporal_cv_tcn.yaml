name: ozon-direct-temporal-cv-tcn
desc: Four-fold 250k direct causal TCN scalar GMV validation, fresh model per fold.
cmd: >
  export PYTHONPATH=. ; python3 -u scripts/run_direct_temporal_cv.py
  --experiment-config configs/direct_temporal_cv_v1/tcn_direct.yaml
  --pre-run-sha __PRE_RUN_SHA__
env:
  python:
    type: manual
    version: 3.10.13
    requirements-file: requirements-datasphere.txt
    local-paths:
      - src/
      - scripts/
      - configs/
      - requirements-datasphere.txt
      - data/train.parquet
      - sample_submit.csv
inputs:
  - data/train.parquet
  - sample_submit.csv
outputs:
  - artifacts/direct_temporal_cv_v1/experiments/direct_cv_tcn_v1/
cloud-instance-types:
  - g1.1
working-storage:
  type: SSD
  size: 100Gb
