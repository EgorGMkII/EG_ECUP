name: ozon-joint-rmsle-submission
desc: Joint RMSLE Meta-Weights Submission (Specialized Hurdle Stack on Tesla V100 GPU)

cmd: >
  export PYTHONPATH=. ; python3 scripts/build_joint_rmsle_submission.py

env:
  python:
    type: manual
    version: 3.10.13
    requirements-file: requirements-datasphere.txt
    local-paths:
      - src/
      - scripts/
      - configs/
      - requirements-datasphere.txt
      - data/train.parquet
      - data/snapshots/
      - sample_submit.csv
      - submission_specialized_hurdle_stack.csv

outputs:
  - submission_specialized_hurdle_joint_rmsle.csv
  - submission_specialized_hurdle_joint_rmsle_diagnostics.parquet
  - test_specialists_raw_predictions_250k.parquet
  - artifacts/specialized_hurdle/

cloud-instance-types:
  - g1.1
