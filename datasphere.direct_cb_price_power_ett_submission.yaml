name: ozon-direct-cb-price-ett-sub
desc: "Full-history 250k submission: CatBoost Price+Power Specialist (0.85) + ETT Direct Regressor (0.15)."
cmd: >
  export PYTHONPATH=. ; export CUDA_VISIBLE_DEVICES=0 ;
  python3 -u scripts/build_direct_cb_price_power_ett_submission.py
  --pre-run-sha __PRE_RUN_SHA__
  --job-id __JOB_ID__
env:
  python:
    type: manual
    version: 3.10.13
    requirements-file: requirements-datasphere.txt
    local-paths:
      - src/
      - scripts/
      - configs/
      - requirements-datasphere.txt
inputs:
  - data/train.parquet
  - sample_submit.csv
outputs:
  - artifacts/direct_cb_price_power_ett_submission/submission.csv
  - artifacts/direct_cb_price_power_ett_submission/manifest.json
cloud-instance-types:
  - g1.1
working-storage:
  type: SSD
  size: 100Gb
