experiment_id: direct_cv_hybrid_cohort_specialist_v1
protocol: FOUR_FOLD_250K_V1
root_seed: 42
enabled_models:
  - hybrid_cohort_specialist
features:
  base_sparse_v1: true
models:
  hybrid_cohort_specialist:
    activity_window_days: 90
    gru_epochs: 3
    gru_batch_size: 512
    gru_learning_rate: 0.001
    gru_hidden_dim: 64
    gru_num_layers: 2
    gru_dropout: 0.1
    gru_weight_decay: 0.0001
    amount_iterations: 400
    amount_depth: 8
    amount_learning_rate: 0.05
    amount_l2_leaf_reg: 5.0
    inactive_iterations: 300
    inactive_depth: 8
    inactive_learning_rate: 0.05
    inactive_l2_leaf_reg: 5.0
    thread_count: 8
    random_seed: 42
inputs:
  train: data/train.parquet
  sample_submit: sample_submit.csv
output_root: artifacts/direct_temporal_cv_v1/experiments/direct_cv_hybrid_cohort_specialist_v1
