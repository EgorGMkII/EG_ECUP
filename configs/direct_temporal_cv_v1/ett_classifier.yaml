experiment_id: direct_cv_ett_classifier_v1
protocol: FOUR_FOLD_250K_V1
root_seed: 42
enabled_models:
  - ett_classifier
features:
  base_sparse_v1: true
models:
  ett_classifier:
    epochs: 2
    batch_size: 512
    learning_rate: 0.0003
    scheduler: cosine
    warmup_fraction: 0.1
    weight_decay: 0.0001
    dropout: 0.1
    history_days: 180
    loss_type: bce
    pos_weight: 1.0
    active_only: false
    activity_window_days: 90
inputs:
  train: data/train.parquet
  sample_submit: sample_submit.csv
output_root: artifacts/direct_temporal_cv_v1/experiments/direct_cv_ett_classifier_v1
