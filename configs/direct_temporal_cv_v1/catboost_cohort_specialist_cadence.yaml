experiment_id: direct_cv_catboost_cohort_specialist_cadence_v1
protocol: FOUR_FOLD_250K_V1
root_seed: 42
enabled_models:
  - catboost_cohort_specialist
features:
  base_sparse_v1: true
models:
  catboost_cohort_specialist:
    activity_window_days: 90
    churn_iterations: 500
    churn_depth: 6
    churn_learning_rate: 0.04
    churn_l2_leaf_reg: 3.0
    amount_iterations: 300
    amount_depth: 8
    amount_learning_rate: 0.05
    amount_l2_leaf_reg: 5.0
    inactive_iterations: 300
    inactive_depth: 8
    inactive_learning_rate: 0.05
    inactive_l2_leaf_reg: 5.0
    thread_count: 8
    random_seed: 42
inputs:
  train: data/train.parquet
  sample_submit: sample_submit.csv
output_root: artifacts/direct_temporal_cv_v1/experiments/direct_cv_catboost_cohort_specialist_cadence_v1
