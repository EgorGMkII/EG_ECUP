experiment_id: direct_cv_penta_stack_coles_226f_v1
protocol: direct_four_fold_v1
root_seed: 42
enabled_models:
  - catboost_direct
  - lightgbm_direct
  - catboost_tweedie
  - lightgbm_tweedie
features:
  provider: sparse_aggregate_v1
  windows_days: [7, 14, 30, 60, 90, 180, 365]
  use_coles_embeddings: true
  coles_dim: 32
models:
  catboost_direct:
    iterations: 500
    depth: 8
    learning_rate: 0.04
    l2_leaf_reg: 5.0
    loss_function: RMSE
    thread_count: 8
    random_seed: 42
  lightgbm_direct:
    iterations: 500
    learning_rate: 0.04
    thread_count: 8
    random_seed: 42
  catboost_tweedie:
    iterations: 500
    depth: 7
    learning_rate: 0.03
    l2_leaf_reg: 5.0
    thread_count: 8
    random_seed: 42
  lightgbm_tweedie:
    iterations: 500
    learning_rate: 0.03
    thread_count: 8
    random_seed: 42
inputs:
  train_path: data/train.parquet
  sample_submit_path: sample_submit.csv
output_root: artifacts/direct_temporal_cv_v1/experiments/direct_cv_penta_stack_coles_226f_v1
