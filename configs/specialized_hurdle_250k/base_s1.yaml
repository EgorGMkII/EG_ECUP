architecture: "S1_Masked_GRU"
d_in: 12
d_model: 128
n_layers: 2
dropout: 0.10
sequence_length: 180

training:
  batch_size: 512
  max_lr: 3.0e-4
  warmup_steps: 500
  max_steps: 8000
  weight_decay: 1.0e-4
  grad_clip: 1.0
  multitask_loss_weights:
    factorized_z: 1.00
    direct_z: 0.25
    conditional_z: 0.25
    reactivation_bce: 0.10
    churn_bce: 0.10
