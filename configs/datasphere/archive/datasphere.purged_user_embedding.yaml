name: ozon-purged-user-embedding
desc: Strictly Purged and Embargoed User-Embedding GRU-180 Suite (0 Target Overlap)

cmd: >
  export PYTHONPATH=. ; python3 scripts/run_purged_user_embedding_experiments.py

env:
  python:
    type: manual
    version: 3.10.13
    requirements-file: requirements-datasphere.txt
    local-paths:
      - src/
      - scripts/
      - configs/
      - requirements-datasphere.txt
      - data/train.parquet
      - data/snapshots/
      - artifacts/selected_users_100k.parquet
      - artifacts/btyd_audit/
      - artifacts/user_embedding/

outputs:
  - artifacts/purged_user_embedding/

cloud-instance-types:
  - g1.1

working-storage:
  type: SSD
  size: 100Gb

graceful-shutdown:
  signal: SIGTERM
  timeout: 30s
