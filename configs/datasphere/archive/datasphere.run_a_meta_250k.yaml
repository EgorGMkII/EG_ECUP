name: ozon-run-a-meta-250k
desc: RUN A — Meta-Training on 250k users (cutoff 2025-12-15) and Joint RMSLE SLSQP Optimization

cmd: >
  export PYTHONPATH=. ; python3 scripts/specialized_hurdle_250k/run_a_meta_250k.py

env:
  python:
    type: manual
    version: 3.10.13
    requirements-file: requirements-datasphere.txt
    local-paths:
      - src/
      - scripts/
      - configs/
      - requirements-datasphere.txt
      - data/train.parquet
      - data/snapshots/
      - sample_submit.csv

outputs:
  - joint_meta_weights_250k.json
  - amount_scaler_250k.json
  - meta_anchor_predictions_250k.parquet
  - run_status.json

cloud-instance-types:
  - g1.1
