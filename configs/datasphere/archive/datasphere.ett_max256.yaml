name: ozon-ett-max256
desc: Controlled sequence length expansion (max_events=256) for Event-Time Transformer

cmd: >
  export PYTHONPATH=. ; python3 scripts/run_ett_max256_experiment.py

env:
  python:
    type: manual
    version: 3.10.13
    requirements-file: requirements-datasphere.txt
    local-paths:
      - src/
      - scripts/
      - configs/
      - requirements-datasphere.txt
      - data/train.parquet
      - data/snapshots/
      - artifacts/selected_users_100k.parquet
      - selected_users_100k.parquet
      - artifacts/ett_optimization/

outputs:
  - artifacts/ett_optimization/

cloud-instance-types:
  - g1.1
