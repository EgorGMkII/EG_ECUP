name: ozon-btyd-audit-fair-eval
desc: Leakage-Free BTYD Audit and Fair Comparative Evaluation (B0-B3)

cmd: >
  export PYTHONPATH=. ; python3 scripts/run_btyd_audit_and_fair_evaluation.py

env:
  python:
    type: manual
    version: 3.10.13
    requirements-file: requirements-datasphere.txt
    local-paths:
      - src/
      - scripts/
      - configs/
      - requirements-datasphere.txt
      - data/train.parquet
      - data/snapshots/
      - artifacts/selected_users_100k.parquet
      - artifacts/btyd_audit/

outputs:
  - artifacts/btyd_audit/
