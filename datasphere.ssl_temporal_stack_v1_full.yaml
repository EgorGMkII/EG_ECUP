name: ozon-ssl-temporal-stack-v1-full
desc: Frozen 11-anchor RUN A plus fresh 14-anchor RUN B temporal validation with SSL and specialists.
cmd: >
  export PYTHONPATH=. ; export CUDA_VISIBLE_DEVICES=0 ; python3 -u scripts/run_ssl_temporal_stack_v1.py --pre-run-sha __PRE_RUN_SHA__
env:
  python:
    type: manual
    version: 3.10.13
    requirements-file: requirements-datasphere.txt
    local-paths:
      - src/
      - scripts/
      - configs/ssl_temporal_stack_v1/
      - requirements-datasphere.txt
      - data/train.parquet
      - selected_users_100k.parquet
outputs:
  - artifacts/ssl_temporal_stack_v1/post_ny_public_proxy/run_manifest.json
  - artifacts/ssl_temporal_stack_v1/post_ny_public_proxy/model_training_report.json
  - artifacts/ssl_temporal_stack_v1/post_ny_public_proxy/run_a_meta_prediction_bank.parquet
  - artifacts/ssl_temporal_stack_v1/post_ny_public_proxy/frozen_meta_package.json
  - artifacts/ssl_temporal_stack_v1/post_ny_public_proxy/run_b_validation_prediction_bank.parquet
  - artifacts/ssl_temporal_stack_v1/post_ny_public_proxy/validation_report.json
  - artifacts/ssl_temporal_stack_v1/post_ny_public_proxy/artifact_sha256.json
cloud-instance-types:
  - g1.1
working-storage:
  type: SSD
  size: 100Gb
graceful-shutdown:
  signal: SIGTERM
  timeout: 30s
